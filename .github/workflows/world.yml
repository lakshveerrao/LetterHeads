name: Deploy the world server

on:
  push:
    branches: [main]
    paths: ["world/**", ".github/workflows/world.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: world
          wranglerVersion: "4.142.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the live server
        run: node world/smoke.mjs https://letterheads-world.venky24aug.workers.dev
