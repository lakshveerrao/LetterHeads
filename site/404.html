<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Letterheads: page not found</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Spectral:wght@600&display=swap">
<style>
:root{--ground:#D5DBC8;--ink:#1F2421;--muted:#4A524D;--ember:#E8962F}
@media (prefers-color-scheme: dark){:root{--ground:#1D2629;--ink:#EEF0EA;--muted:#B8C0B9}}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding-inline:16px;background:var(--ground);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;text-align:center}
h1{margin:0 0 8px;font-family:Spectral,Georgia,serif;font-weight:600;font-size:clamp(28px,6vw,44px);text-wrap:balance}
p{margin:0 0 24px;color:var(--muted);font-size:17px;line-height:1.5}
a{display:inline-flex;align-items:center;min-height:48px;padding:0 24px;border-radius:24px;background:var(--ember);color:#1A1208;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>This path leads nowhere yet.</h1>
<p>The letters haven't walked here. Their valley is this way.</p>
<a href="/play/">Go to the valley</a>
</main>
</body>
</html>
